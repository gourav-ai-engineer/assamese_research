protocol_version: "v1-2026-10-10"
languages:
  as: {name: Assamese, script: Bengali}
  mni: {name: Manipuri/Meitei, script: Meitei_Mayek}
  brx: {name: Bodo, script: Devanagari}
  hi: {name: Hindi, role: reference}
tasks: [translation, qa, summarization]
conditions: [zero_shot, one_shot_same_language, one_shot_hindi]
decoding: {do_sample: false, max_new_tokens: 256}
sampling: {flores_sentences_per_direction: 500, qa_items_per_language: 300, seed: 20261010}
metrics: {translation: [corpus_chrf, sentence_chrf], qa: [mean_token_f1]}
human_evaluation:
  outputs_per_language: 100
  scales: [adequacy_1_to_5, fluency_1_to_5]
  error_tags: [wrong_language_or_script, missing_information, hallucinated_content, wrong_word_sense, grammar_or_inflection]
# Targets only: verify dataset coverage before running.
