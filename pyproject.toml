[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northeast-small-llm-eval"
version = "0.1.0"
description = "Reproducible evaluation pipeline for small open LLMs on Northeast Indian languages"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7",
  "pydantic>=2.7,<3",
  "sacrebleu>=2.4,<3",
  "transformers>=4.49",
  "accelerate>=0.34",
  "sentencepiece>=0.2",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
northeast-eval = "northeast_eval.cli:app"

[tool.setuptools.packages.find]
include = ["northeast_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
