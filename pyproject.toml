[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "northeast-small-llm-eval"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["typer>=0.12,<1", "rich>=13.7", "sacrebleu>=2.4,<3", "transformers>=4.49", "accelerate>=0.34", "sentencepiece>=0.2", "numpy>=1.26"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
northeast-eval = "northeast_eval.cli:app"
[tool.setuptools.packages.find]
include = ["northeast_eval*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
